services:
  - type: web
    name: pydantic-ai-researcher-v2
    repo: https://github.com/ojusave/pydantic-render-workflows-validation
    branch: pydantic-ai-v2
    runtime: docker
    region: oregon
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: RENDER_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        generateValue: true
      - key: WORKFLOW_SLUG
        fromService:
          name: pydantic-ai-researcher-v2-workflow
          type: workflow
          property: slug
      - key: WORKFLOWS_ENABLED
        value: "true"

  - type: workflow
    name: pydantic-ai-researcher-v2-workflow
    runtime: python
    region: oregon
    repo: https://github.com/ojusave/pydantic-render-workflows-validation
    branch: pydantic-ai-v2
    autoDeployTrigger: off
    buildCommand: pip install uv==0.12.1 && uv sync --frozen --no-dev
    startCommand: .venv/bin/python hosted.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: PYDANTIC_AI_MODEL
        value: openai:gpt-5.4-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pydantic-ai-validation-db
          property: connectionString

databases:
  - name: pydantic-ai-validation-db
    region: oregon
    plan: basic-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    ipAllowList: []
