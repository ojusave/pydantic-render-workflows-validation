[project]
name = "pydantic-render-workflows-validation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic-ai-harness[render] @ git+https://github.com/ojusave/pydantic-ai-harness-render-workflows.git@4ce2364b5274241f51ab2cf94fcaed2cac370293",
    "pydantic-ai-slim[openai,duckduckgo,web-fetch]>=2.40.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
