[project]
name = "pydantic-render-workflows-validation"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "asyncpg>=0.30.0",
    "pydantic-ai-harness[render]",
    "pydantic-ai-slim[openai,duckduckgo,web-fetch]",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
pydantic-ai-harness = { git = "https://github.com/ojusave/pydantic-ai.git", rev = "b25a84283914c3462250918152313ff408ed0a1f", subdirectory = "src/pydantic_ai_harness" }
pydantic-ai-slim = { git = "https://github.com/ojusave/pydantic-ai.git", rev = "b25a84283914c3462250918152313ff408ed0a1f", subdirectory = "pydantic_ai_slim" }
pydantic-graph = { git = "https://github.com/ojusave/pydantic-ai.git", rev = "b25a84283914c3462250918152313ff408ed0a1f", subdirectory = "pydantic_graph" }
